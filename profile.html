<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ประวัติผู้สูงอายุ — ระบบบันทึกผู้สูงอายุ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Trirong:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile">
<div class="layout">
  <nav id="sidebar" class="sidebar" aria-label="เมนูหลัก"></nav>

  <main class="content">
    <a href="index.html" style="text-decoration: none">← กลับไปรายชื่อ</a>

    <section class="card" style="flex-direction: row; flex-wrap: wrap; align-items: center; gap: 24px">
      <div id="p-avatar" class="avatar lg"></div>
      <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px">
        <div class="row">
          <h1 id="p-name" style="font-size: 28px"></h1>
          <span id="p-status" class="badge"></span>
        </div>
        <span id="p-info" class="page-sub"></span>
        <span id="p-contact" class="page-sub"></span>
      </div>
      <div class="row">
        <a id="p-record-link" class="btn btn-primary" href="record.html">+ บันทึกอาการ</a>
        <button type="button" id="p-edit" class="btn">แก้ไขข้อมูล</button>
        <a id="p-history-link" class="btn" href="history.html">ประวัติการแก้ไข</a>
        <a id="p-transfer-link" class="btn" href="report.html?type=transfer">พิมพ์ใบส่งตัวไป รพ.</a>
      </div>
    </section>

    <div id="p-allergy-box" class="alert danger" role="note">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>
      <span id="p-allergy"></span>
    </div>

    <div class="grid-3">
      <section class="card">
        <h2 class="card-title">โรคประจำตัว</h2>
        <div id="p-conditions" class="row" style="gap: 8px"></div>
      </section>
      <section class="card">
        <h2 class="card-title">ข้อควรระวัง</h2>
        <p id="p-caution" style="margin: 0; white-space: pre-line"></p>
      </section>
      <section class="card">
        <h2 class="card-title">นัดหมายถัดไป</h2>
        <p id="p-appt" style="margin: 0"></p>
      </section>
    </div>

    <section class="card">
      <div class="row between">
        <h2 class="card-title">เกณฑ์ค่าผิดปกติ</h2>
        <button type="button" id="p-limits" class="btn">ตั้งเกณฑ์เฉพาะคนนี้</button>
      </div>
      <p class="page-sub" style="margin: 0">ช่วงค่าปกติ ค่าที่อยู่นอกช่วงจะขึ้นสีแดงในบันทึกการตรวจและรายงาน</p>
      <ul id="p-limit-list" class="limit-list"></ul>
    </section>

    <section class="card">
      <div class="row between">
        <h2 class="card-title">ยาที่ใช้ประจำ</h2>
        <button type="button" id="p-add-med" class="btn">+ เพิ่มยา</button>
      </div>
      <div class="table-wrap">
        <table style="min-width: 640px">
          <thead><tr><th>ชื่อยา</th><th>ขนาด</th><th>วิธีใช้</th><th>รอบที่ให้</th><th class="center"><span class="sr-only">แก้ไข</span></th></tr></thead>
          <tbody id="p-meds"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">บันทึกพยาบาลล่าสุด</h2>
      <div id="p-notes"></div>
    </section>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/reports.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
