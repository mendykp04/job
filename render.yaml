# ตั้งค่าสำหรับ Render (https://render.com)
# วิธีใช้: Render → New → Blueprint → เลือก repo นี้ → ใส่ ADMIN_PASSWORD → Apply
#
# ตอนนี้เป็นแบบฟรี (ทดลอง): ข้อมูลจะถูกล้างทุกครั้งที่เว็บหลับ (ไม่มีคนใช้ 15 นาที) หรือมีการอัปเดต
# จะใช้จริง ให้เปลี่ยนเป็นแบบเสียเงินที่มีพื้นที่เก็บถาวร:
#   1. เปลี่ยน plan: free เป็น plan: starter
#   2. เอาเครื่องหมาย # หน้า disk: ... และ CARE_DB ออก
#   3. ลบ EPHEMERAL และ ADMIN_PASSWORD ออก (ตั้งบัญชีหัวหน้าเองด้วย SETUP_TOKEN แทน)
services:
  - type: web
    name: elderly-care
    runtime: python
    plan: free
    region: singapore
    buildCommand: python3 --version
    startCommand: python3 server.py
    healthCheckPath: /api/status
    autoDeploy: true
    # disk:
    #   name: care-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # - key: CARE_DB
      #   value: /var/data/care.db
      - key: EPHEMERAL
        value: "1"
      # บัญชีหัวหน้าที่สร้างให้เองทุกครั้งที่เว็บเริ่มใหม่ (Render จะให้กรอกรหัสผ่านตอนสร้าง อย่างน้อย 8 ตัว)
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # รหัสลับสำหรับตั้งค่าครั้งแรกด้วยตัวเอง (ใช้เมื่อไม่ได้ตั้ง ADMIN_PASSWORD)
      - key: SETUP_TOKEN
        generateValue: true
