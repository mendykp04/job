# ตั้งค่าสำหรับ Render (https://render.com) — แบบฟรี เก็บข้อมูลที่ Turso (ฟรี ข้อมูลไม่หาย)
# วิธีใช้: Render → New → Blueprint → เลือก repo นี้ → กรอกค่า 3 ช่องที่ Render ถาม → Apply
#   TURSO_DATABASE_URL  ที่อยู่ฐานข้อมูล จาก Turso (ขึ้นต้นด้วย libsql://)
#   TURSO_AUTH_TOKEN    รหัสเข้าฐานข้อมูล จาก Turso (กด Create Token ในหน้าฐานข้อมูล)
#   ADMIN_PASSWORD      รหัสผ่านบัญชีหัวหน้า (ชื่อผู้ใช้ admin) อย่างน้อย 8 ตัว
#                       ใช้แค่ตอนเริ่มครั้งแรก หลังเข้าสู่ระบบแล้วเปลี่ยนรหัสผ่านในเว็บได้
#
# แบบฟรี: เว็บหลับเมื่อไม่มีคนใช้ 15 นาที คนแรกที่เข้าต้องรอประมาณ 1 นาที แต่ข้อมูลไม่หาย
services:
  - type: web
    name: elderly-care
    runtime: python
    plan: free
    region: singapore
    buildCommand: python3 --version
    startCommand: python3 server.py
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # รหัสลับสำหรับตั้งบัญชีหัวหน้าเองครั้งแรก (ใช้เมื่อไม่ได้ตั้ง ADMIN_PASSWORD)
      - key: SETUP_TOKEN
        generateValue: true
